name: "⚽ Atualizar Calendário Copa 2026"

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sincronizar resultados e regenerar .ics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preencher planteis (so se vazios)
        run: python3 fetch_squads.py

      - name: Sincronizar resultados
        run: python3 sync.py

      - name: Commit se houver mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add copa_2026_icalendar.ics copa_2026_outlook.ics data/data.json
          git diff --staged --quiet && echo "Sem mudancas." || (
            git commit -m "Auto: $(date -u '+%Y-%m-%d %H:%M UTC')" &&
            git push
          )
